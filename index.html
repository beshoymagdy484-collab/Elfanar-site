<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>الفنار سكاوت</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f8;--card:#fff;--ink:#0b1f3a;--mut:#5b6b82;--navy:#0b1f3a;--silver:#c5ccd6;--line:#dde2ea;--ok:#1d7a4d;--bad:#b23a3a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#08121f;--card:#0f2038;--ink:#eef2f7;--mut:#9fb0c6;--navy:#16335a;--line:#1f3556}}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;font-family:Cairo,Tahoma,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
header{background:#0b1f3a;color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header b{flex:1;font-weight:800}
header select{background:#16335a;color:#fff;border:1px solid #3a5580;border-radius:8px;padding:4px;font-family:inherit}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 10px;background:#13294a}
nav a{color:#c5ccd6;text-decoration:none;white-space:nowrap;padding:5px 12px;border-radius:99px;font-size:14px}
nav a.on{background:#c5ccd6;color:#0b1f3a;font-weight:600}
main{max-width:900px;margin:0 auto;padding:14px}
h2{margin:6px 0 10px;font-size:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.alert{background:#0b1f3a;color:#fff;border-radius:12px;padding:14px;margin-bottom:12px;border-inline-start:6px solid #c5ccd6}
.alert small{color:#c5ccd6}
.hero{text-align:center;padding:18px 8px}
.hero svg{width:96px;height:96px}
button,.btn{font-family:inherit;background:#0b1f3a;color:#fff;border:0;border-radius:8px;padding:7px 14px;cursor:pointer;font-size:14px}
button.s{background:var(--line);color:var(--ink)}
input,select,textarea{font-family:inherit;font-size:15px;padding:7px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);max-width:100%}
input[type=text],textarea{width:100%}
.mut{color:var(--mut);font-size:13px}
.tag{display:inline-block;padding:1px 10px;border-radius:99px;font-size:12px;color:#fff}
.av{width:44px;height:44px;border-radius:50%;background:#c5ccd6;color:#0b1f3a;display:grid;place-items:center;font-weight:800;flex:none}
.tbl{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:start;white-space:nowrap}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:#0b1f3a}
.note{font-size:12px;color:var(--mut);text-align:center;padding:10px}
a{color:inherit}
</style>
</head>
<body>
<header>
<img src="icon.png" width="30" height="30" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display=''"><svg width="26" height="26" viewBox="0 0 64 64" style="display:none"><use href="#fn"/></svg>
<b>الفنار سكاوت</b>
<span id="who" class="mut" style="color:#c5ccd6"></span><button class="s" id="lb" onclick="lbc()">دخول الإدارة</button>
</header>
<nav id="nav"></nav>
<main id="app"><div class="card">جاري التحميل...</div></main>

<svg width="0" height="0" style="position:absolute"><defs><g id="fn" fill="none" stroke="#c5ccd6" stroke-width="3" stroke-linejoin="round"><path d="M26 56 L30 20 H34 L38 56 Z" fill="#fff" fill-opacity=".15"/><path d="M28 20 H36 L32 10 Z"/><path d="M12 28 L28 24 M52 28 L36 24"/><path d="M20 56 H44"/></g></defs></svg>
<div id="login" style="display:none;position:fixed;inset:0;z-index:20;background:#0b1f3a;place-items:center;padding:20px"><div class="card" style="width:min(340px,100%)"><div class="hero"><svg viewBox="0 0 64 64" style="background:#0b1f3a;border-radius:50%;padding:8px"><use href="#fn"/></svg><h2>الفنار سكاوت</h2></div><input id="em" type="text" dir="ltr" placeholder="البريد الإلكتروني"><input id="pw" type="password" dir="ltr" placeholder="كلمة المرور" style="width:100%;margin:8px 0"><input id="sc" type="text" dir="ltr" placeholder="كود الربط (للحساب الجديد فقط)" style="width:100%;margin-bottom:8px"><button onclick="doLogin()" style="width:100%">دخول</button><button class="s" onclick="doSignup()" style="width:100%;margin-top:6px">إنشاء حساب جديد</button><button class="s" onclick="$('#login').style.display='none'" style="width:100%;margin-top:6px">رجوع للموقع</button><div id="lm" class="neg" style="margin-top:6px"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const showErr=m=>{const a=document.getElementById("app");if(a)a.innerHTML="<div class=card style=color:#b23a3a>حدث خطأ: "+String(m).replace(/</g,"")+"</div>"};
window.onerror=(m)=>showErr(m);addEventListener("unhandledrejection",e=>showErr(e.reason&&e.reason.message||e.reason));
const $=s=>document.querySelector(s);
const today=new Date().toISOString().slice(0,10);
const D=(n)=>{const d=new Date();d.setDate(d.getDate()-n);return d.toISOString().slice(0,10)};
let S={patrols:[],scouts:[],badges:[],awards:[],meet:[],bonus:[],lib:{},news:[],albums:[],log:[]};
const save=()=>{};
const SB=supabase.createClient('https://gythhoywshbygqmdnyod.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd5dGhob3l3c2hieWdxbWRueW9kIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ5MzU5MDksImV4cCI6MjExMDUxMTkwOX0.5l_s_I7zGTM6NSk17Y9cSsiRcRYKZZYRjMo4nYuYuhc');
const ok=async p=>{const r=await p;if(r.error){alert('حدث خطأ: '+r.error.message);throw r.error}return r};
let role="admin1";
const ROLE={admin1:"المسؤول الأساسي",admin2:"المسؤول الثاني",scout:"كشاف"};
const adm=()=>role!=="scout";
const logit=(op,det)=>SB.from('audit_log').insert({who:(SES&&SES.user?SES.user.email:'')+' — '+ROLE[role],op,details:det});
const age=b=>Math.floor((Date.now()-new Date(b))/31557600000);
const act=()=>S.scouts.filter(s=>!s.arch);
const sc=id=>S.scouts.find(s=>s.id==id);
const pt=id=>S.patrols.find(p=>p.id==id);
const bal=id=>S.bonus.filter(b=>b.s==id).reduce((a,b)=>a+b.v,0);
const att=id=>{const m=S.meet.filter(x=>id in x.p);const p=m.filter(x=>x.p[id]).length;return{p,t:m.length,r:m.length?Math.round(p/m.length*100):0}};
const ini=n=>n.trim()[0];
const logo=()=>`<img src="logo.png" alt="الفنار سكاوت" style="width:150px;max-width:60%" onerror="this.style.display='none';this.nextElementSibling.style.display=''"><svg viewBox="0 0 64 64" style="display:none;background:#0b1f3a;border-radius:50%;padding:8px"><use href="#fn"/></svg>`;
const pages=[["home","الرئيسية"],["me","صفحتي"],["scouts","الكشافين"],["patrols","الطلايع"],["attend","الحضور"],["bonus","البونص"],["badges","الشارات"],["lib","المكتبة"],["news","الأخبار"],["album","الذكريات"],["stats","الإحصائيات"],["log","السجل"],["admin","الإعدادات"]];
const vis=k=>({log:adm(),admin:role==="admin1",scouts:adm(),scout:adm(),attend:adm(),bonus:adm(),stats:adm(),me:!!SES&&!adm()})[k]!==false;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let libSec="الصيحات الكشفية",q="",ym=today.slice(0,7),selM=null,per=30;
function R(){
const h=(location.hash||"#home").slice(1);const [pg,arg]=h.split("-");
$("#nav").innerHTML=pages.filter(p=>vis(p[0])).map(p=>`<a href="#${p[0]}" class="${p[0]==pg||(pg=="scout"&&p[0]=="scouts")?"on":""}">${p[1]}</a>`).join("");
const f=V[pg]||V.home;$("#app").innerHTML=vis(pg)||!V[pg]?f(arg):'<div class="card">هذه الصفحة للإدارة فقط.</div>';
}
const V={
home(){const imp=S.news.filter(n=>n.imp);return`<div class="hero">${logo()}<h2>أهلًا بك في الفنار سكاوت</h2><div class="mut">مجموعة الفنار الكشفية</div></div>
${imp.map(n=>`<div class="alert"><b>${esc(n.t)}</b><br>${esc(n.x)}<br><small>${n.date}</small></div>`).join("")}
<div class="grid">${[["scouts","دليل الكشافين"],["lib","المكتبة الكشفية"],["album","ألبوم الذكريات"],["news","الأخبار"],["patrols","الطلايع"],["attend","الحضور"]].filter(a=>vis(a[0])).map(a=>`<a class="card" href="#${a[0]}" style="text-decoration:none;text-align:center;font-weight:600">${a[1]}</a>`).join("")}</div>`},
me(){if(!SES)return`<div class="card">سجّل دخولك لعرض صفحتك.<br><button onclick="$('#login').style.display='grid'" style="margin-top:6px">دخول / إنشاء حساب</button></div>`;if(adm())return'<div class="card">أنت مسجل كمسؤول، وصفحات الكشافين من قسم الكشافين.</div>';const s=S.scouts[0];if(!s)return`<div class="card"><b>اربط حسابك بملفك</b><div class="mut">اكتب الكود اللي أخدته من الإدارة</div><input id="cc" type="text" dir="ltr" placeholder="مثال: K7M2QX" style="margin:6px 0"><button onclick="linkCode()">ربط</button></div>`;return V.scout(s.id,1)},
scouts(){return`<h2>دليل الكشافين</h2>${adm()?`<div class="card row"><input id="nn" type="text" placeholder="اسم كشاف جديد" style="flex:1"><button onclick="addScout()">إضافة</button><label class="btn s" style="background:var(--line);color:var(--ink)">استيراد Excel/CSV<input type="file" accept=".csv" hidden onchange="imp(this)"></label></div>`:""}
${act().map(s=>`<a class="card row" href="#scout-${s.id}" style="text-decoration:none">${av(s)}<div style="flex:1"><b>${esc(s.name)}</b><div class="mut">${s.stage} · ${pt(s.patrol)?.name||"—"}</div></div><span class="mut">${bal(s.id)} نقطة</span></a>`).join("")}
${S.scouts.some(s=>s.arch)?`<h2>الأرشيف</h2>`+S.scouts.filter(s=>s.arch).map(s=>`<a class="card" href="#scout-${s.id}" style="display:block;text-decoration:none">${esc(s.name)} <span class="mut">(مؤرشف)</span></a>`).join(""):""}`},
scout(id,own){const s=sc(id);if(!s)return"";const a=att(s.id);
return`<div class="card row">${av(s,64)}<div><h2 style="margin:0">${esc(s.name)}</h2><span class="mut">${age(s.birth)} سنة · ${s.stage}</span></div></div>
<div class="card"><b>بيانات شخصية</b><br>تاريخ الميلاد: ${s.birth}<br>أب الاعتراف: ${esc(s.father)}
${adm()||own?`<br>التليفون: ${s.phone}<br>ولي الأمر: ${s.parent}<br>العنوان: ${esc(s.addr)}`:`<br><span class="mut">الأرقام والعنوان للإدارة فقط</span>`}</div>
<div class="card"><b>بيانات كشفية</b><br>الانضمام: ${s.join}<br>الطليعة: ${pt(s.patrol)?.name||"—"}<br>الكوفية: ${esc(s.scarf)}<br>الحضور: ${a.p} من ${a.t} (${a.r}%)</div>
<div class="card"><b>الشارات</b><div class="row">${S.awards.filter(w=>w.s==s.id).map(w=>{const b=S.badges.find(x=>x.id==w.b);return`<div style="text-align:center">${bi(b.img)}<div style="font-size:13px">${esc(b.name)}</div><div class="mut">${w.date}</div></div>`}).join("")||"<span class='mut'>لا شارات بعد</span>"}</div></div>
<div class="card"><b>رصيد البونص: ${bal(s.id)}</b><div class="tbl"><table>${S.bonus.filter(b=>b.s==s.id).map(b=>`<tr><td class="${b.v>0?"pos":"neg"}">${b.v>0?"+":""}${b.v}</td><td>${esc(b.why)}</td><td>${b.date}</td></tr>`).join("")}</table></div></div>
${adm()?`<div class="card"><b>تعديل البيانات</b> <span class="mut">— كود الربط: <b dir="ltr">${s.claim_code||"—"}</b></span><div class="grid" style="margin-top:6px">${[["name","الاسم",s.name,"text"],["birth","تاريخ الميلاد",s.birth,"date"],["stage","المرحلة الدراسية",s.stage,"text"],["father","أب الاعتراف",s.father,"text"],["join","تاريخ الانضمام",s.join,"date"],["scarf","الكوفية",s.scarf,"text"],["phone","التليفون",s.phone,"text"],["parent","تليفون ولي الأمر",s.parent,"text"],["addr","العنوان",s.addr,"text"]].map(f=>`<label class="mut">${f[1]}<input id="e_${f[0]}" type="${f[3]}" value="${esc(f[3]=="date"&&!/^\d/.test(f[2])?"":f[2])}" style="width:100%"></label>`).join("")}</div><div style="margin-top:8px"><label class="mut">الصورة الشخصية: <input type="file" accept="image/*" onchange="setPhoto(${s.id},this)"></label></div><button style="margin-top:8px" onclick="saveScout(${s.id})">حفظ</button></div>`:""}
${adm()?`<div class="card row"><select onchange="mv(${s.id},this.value)">${S.patrols.map(p=>`<option value="${p.id}" ${p.id==s.patrol?"selected":""}>${p.name}</option>`).join("")}</select><button class="s" onclick="delScout(${s.id})">حذف الكشاف</button></div>`:""}`},
patrols(){return`<h2>الطلايع</h2>${adm()?`<div class="card"><b>طليعة جديدة</b><div class="row" style="margin-top:6px"><input id="pn" type="text" placeholder="اسم الطليعة" style="flex:1"><input id="pc" type="color" value="#0b1f3a"><button onclick="addP()">إضافة</button></div></div>`:""}
${S.patrols.map(p=>`<div class="card"><div class="row">${pl(p.logo)}<b style="flex:1">${esc(p.name)}</b><span class="tag" style="background:${esc(p.color||"#0b1f3a")}">&nbsp;&nbsp;&nbsp;&nbsp;</span></div><div class="mut">الصيحة: ${esc(p.cry||"—")}</div>${/^http/.test(p.flag||"")?`<img src="${esc(p.flag)}" style="max-width:100%;max-height:120px;border-radius:8px;margin:6px 0">`:(p.flag?`<div class="mut">العلم: ${esc(p.flag)}</div>`:"")}<div style="margin-top:6px"><span class="mut">الأفراد:</span> ${act().filter(s=>s.patrol==p.id).map(s=>esc(s.name)).join("، ")||"—"}</div>${adm()?`<details style="margin-top:8px"><summary style="cursor:pointer">تعديل الطليعة</summary><div class="grid" style="margin-top:6px"><label class="mut">الاسم<input id="pn_${p.id}" type="text" value="${esc(p.name)}"></label><label class="mut">اللون<input id="pc_${p.id}" type="color" value="${esc(p.color||"#0b1f3a")}"></label><label class="mut">الصيحة<input id="py_${p.id}" type="text" value="${esc(p.cry||"")}"></label><label class="mut">الشعار (إيموجي)<input id="pe_${p.id}" type="text" value="${/^http/.test(p.logo||"")?"":esc(p.logo||"")}"></label></div><div class="mut" style="margin-top:6px">صورة الشعار: <input id="pl_${p.id}" type="file" accept="image/*"></div><div class="mut" style="margin-top:6px">صورة العلم: <input id="pf_${p.id}" type="file" accept="image/*"></div><div class="row" style="margin-top:8px"><button onclick="saveP(${p.id})">حفظ</button><button class="s" onclick="delP(${p.id})">حذف الطليعة</button></div></details>`:""}</div>`).join("")}`},
attend(){const ms=S.meet.filter(m=>m.date.slice(0,7)==ym).sort((a,b)=>b.date>a.date?1:-1);
const [Y,M]=ym.split('-').map(Number),first=(new Date(Y,M-1,1).getDay()+1)%7,dn=new Date(Y,M,0).getDate();
const rate=m=>{const v=Object.values(m.p);return v.length?Math.round(v.filter(Boolean).length/v.length*100):0};
const cs=[];for(let i=0;i<first;i++)cs.push('<div></div>');
for(let d=1;d<=dn;d++){const ds=ym+'-'+String(d).padStart(2,'0'),m=S.meet.find(x=>x.date==ds),r=m?rate(m):0;cs.push(`<div style="text-align:center;padding:6px 2px;border-radius:8px;${m?`background:${r>=75?'#1d7a4d':r>=50?'#c9962b':'#b23a3a'};color:#fff;cursor:pointer`:''}" ${m?`onclick="selM='${ds}';R()"`:''}>${d}${m?`<div style="font-size:11px">${r}%</div>`:''}</div>`)}
const list=selM?S.meet.filter(m=>m.date==selM):ms;
return`<h2>الحضور والغياب</h2>
${adm()?`<div class="card row"><input type="date" id="md" value="${today}"><button onclick="newM()">اجتماع جديد</button></div>`:''}
<div class="card"><div class="row"><input type="month" value="${ym}" onchange="ym=this.value;selM=null;R()"><span class="mut">${ms.length} اجتماع في الشهر</span></div>
<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px;font-size:13px"><b style="text-align:center">سبت</b><b style="text-align:center">أحد</b><b style="text-align:center">اثنين</b><b style="text-align:center">ثلاثاء</b><b style="text-align:center">أربعاء</b><b style="text-align:center">خميس</b><b style="text-align:center">جمعة</b>${cs.join('')}</div>
<div class="mut" style="margin-top:6px">اضغط على يوم ملوّن لعرض تفاصيل الاجتماع</div></div>
<div class="card"><b>ملخص الشهر</b><div class="mut">متوسط الحضور ${ms.length?Math.round(ms.reduce((a,m)=>a+rate(m),0)/ms.length):0}%</div><div class="tbl"><table>${act().map(s=>{const p=ms.filter(m=>m.p[s.id]).length;return`<tr><td>${esc(s.name)}</td><td>${p}/${ms.length}</td><td>${ms.length?Math.round(p/ms.length*100):0}%</td></tr>`}).join('')}</table></div></div>
${selM?`<button class="s" onclick="selM=null;R()" style="margin-bottom:8px">عرض كل اجتماعات الشهر</button>`:''}
${list.map(m=>{const n=Object.values(m.p).filter(Boolean).length;return`<div class="card"><b>${m.date}</b> <span class="mut">حضور ${n} من ${Object.keys(m.p).length}</span><div class="tbl"><table>${act().map(s=>`<tr><td>${esc(s.name)}</td><td>${adm()?`<button class="${m.p[s.id]?'':'s'}" onclick="tg('${m.date}',${s.id})">${m.p[s.id]?'حاضر':'غائب'}</button>`:(m.p[s.id]?'حاضر':'غائب')}</td></tr>`).join('')}</table></div></div>`}).join('')||'<div class="mut">لا اجتماعات في هذا الشهر</div>'}`},
bonus(){return`<h2>البونص</h2>${adm()?`<div class="card"><div class="row"><select id="bt"><option value="s">كشاف</option><option value="p">طليعة</option><option value="a">الكل</option></select><select id="bs">${act().map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join("")}</select><select id="bp">${S.patrols.map(p=>`<option value="${p.id}">${p.name}</option>`).join("")}</select></div><div class="row" style="margin-top:6px"><input id="bv" type="number" placeholder="± نقاط" style="width:90px"><input id="bw" type="text" placeholder="السبب" style="flex:1"><button onclick="addB()">تسجيل</button></div></div>`:""}
<div class="card tbl"><table>${S.bonus.slice().reverse().map(b=>`<tr><td>${esc(sc(b.s)?.name||"")}</td><td class="${b.v>0?"pos":"neg"}">${b.v>0?"+":""}${b.v}</td><td>${esc(b.why)}</td><td>${b.date}</td><td>${b.by}</td></tr>`).join("")}</table></div>`},
badges(){return`<h2>مكتبة الشارات</h2><div class="grid">${S.badges.map(b=>`<div class="card" style="text-align:center">${bi(b.img)}<b>${esc(b.name)}</b><div class="mut">${esc(b.desc)}</div><div class="mut">${S.awards.filter(w=>w.b==b.id).length} كشاف</div></div>`).join("")}</div>
${adm()?`<div class="card row"><select id="gb">${S.badges.map(b=>`<option value="${b.id}">${esc(b.name)}</option>`).join("")}</select><select id="gs">${act().map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join("")}</select><button onclick="award()">منح الشارة</button></div><div class="card row"><input id="bn" type="text" placeholder="اسم شارة جديدة" style="flex:1"><input id="bd" type="text" placeholder="الوصف" style="flex:1"><input id="bf" type="file" accept="image/*"><button onclick="addBadge()">إضافة</button></div>`:""}`},
lib(){const items=S.lib[libSec].filter(i=>(i.t+i.x).includes(q));return`<h2>المكتبة الكشفية</h2><div class="row" style="margin-bottom:8px">${Object.keys(S.lib).map(k=>`<button class="${k==libSec?"":"s"}" onclick="libSec='${k}';q='';R()">${k}</button>`).join("")}</div>
<input type="text" placeholder="بحث داخل ${libSec}" value="${esc(q)}" oninput="q=this.value;lq()" id="lq"><div id="li" style="margin-top:8px">${li(items)}</div>
${adm()?`<div class="card" style="margin-top:8px"><b>إضافة في قسم ${libSec}</b><input id="lt" type="text" placeholder="العنوان" style="margin-top:6px"><textarea id="lx" rows="3" placeholder="المحتوى" style="margin-top:6px"></textarea><div class="mut" style="margin-top:6px">صور: <input id="lf" type="file" accept="image/*" multiple></div><input id="ly" type="text" dir="ltr" placeholder="رابط فيديو يوتيوب (اختياري)" style="margin-top:6px"><button style="margin-top:8px" onclick="addL()">إضافة</button></div>`:""}`},
news(){return`<h2>الأخبار والإعلانات</h2>${adm()?`<div class="card"><input id="nt" type="text" placeholder="العنوان"><input id="nx" type="text" placeholder="النص" style="margin-top:6px"><div class="row" style="margin-top:6px"><label><input type="checkbox" id="ni"> مهم (يظهر في الرئيسية)</label><button onclick="addN()">نشر</button></div></div>`:""}
${S.news.map(n=>`<div class="card" ${n.imp?'style="border-inline-start:5px solid #0b1f3a"':""}><b>${esc(n.t)}</b> ${n.imp?'<span class="tag" style="background:#0b1f3a">مهم</span>':""}<div>${esc(n.x)}</div><div class="mut">${n.date}</div></div>`).join("")}`},
album(){return`<h2>ألبوم الذكريات</h2>${adm()?`<div class="card row"><input id="at" type="text" placeholder="اسم المناسبة" style="flex:1"><button onclick="addA()">ألبوم جديد</button></div>`:""}<div class="grid">${S.albums.map(a=>`<div class="card"><b>${esc(a.t)}</b><div class="mut">${a.date}</div><div style="font-size:13px">${esc(a.x||"")}</div>${a.photos.map(u=>`<img src="${esc(u)}" loading="lazy" style="width:100%;border-radius:8px;margin-top:6px">`).join("")}${adm()?`<label class="mut" style="display:block;margin-top:6px">إضافة صور <input type="file" accept="image/*" multiple onchange="addPhotos(${a.id},this)"></label>`:""}</div>`).join("")}</div>`},
stats(){const A=act(),c=per?new Date(Date.now()-per*864e5).toISOString().slice(0,10):'',ms=S.meet.filter(m=>m.date>=c),bo=S.bonus.filter(b=>b.date>=c),aw=S.awards.filter(w=>w.date>=c),add=bo.reduce((a,b)=>a+(b.v>0?b.v:0),0),ded=bo.reduce((a,b)=>a+(b.v<0?-b.v:0),0);
const rt=s=>{const p=ms.filter(m=>m.p[s.id]).length;return{p,r:ms.length?Math.round(p/ms.length*100):0}};
const avg=A.length&&ms.length?Math.round(A.reduce((a,s)=>a+rt(s).r,0)/A.length):0;
return`<h2>الإحصائيات والتقارير</h2><div class="card row"><span>الفترة:</span><select onchange="per=+this.value;R()">${[[7,'آخر أسبوع'],[30,'آخر شهر'],[90,'آخر 3 شهور'],[365,'آخر سنة'],[0,'كل الفترات']].map(o=>`<option value="${o[0]}" ${o[0]==per?'selected':''}>${o[1]}</option>`).join('')}</select></div>
<div class="grid"><div class="card"><b>${A.length}</b><div class="mut">إجمالي الكشافين</div></div><div class="card"><b>${ms.length}</b><div class="mut">اجتماع</div></div><div class="card"><b>${avg}%</b><div class="mut">متوسط الالتزام</div></div><div class="card"><b>${aw.length}</b><div class="mut">شارة مكتسبة</div></div><div class="card"><b class="pos">+${add}</b> / <b class="neg">-${ded}</b><div class="mut">بونص مضاف / مخصوم</div></div></div>
<div class="card"><b>أعداد الكشافين بكل طليعة</b>${S.patrols.map(p=>`<div>${esc(p.name)}: ${A.filter(s=>s.patrol==p.id).length}</div>`).join('')}<div>بدون طليعة: ${A.filter(s=>!pt(s.patrol)).length}</div></div>
<div class="card"><b>الحضور والغياب لكل كشاف</b>${A.map(s=>{const t=rt(s);return`<div class="mut">${esc(s.name)} — حضر ${t.p} من ${ms.length} (${t.r}%)</div><div class="bar"><i style="width:${t.r}%"></i></div>`}).join('')}</div>
<div class="card"><b>الشارات المكتسبة</b>${S.badges.map(b=>`<div>${esc(b.name)}: ${aw.filter(w=>w.b==b.id).length}</div>`).join('')||'—'}</div>`},
log(){return`<h2>سجل النشاط الإداري</h2><div class="card tbl"><table>${S.log.map(l=>`<tr><td>${l.at}</td><td>${l.who}</td><td>${esc(l.op)}</td><td>${esc(l.det)}</td></tr>`).join("")||"<tr><td>لا عمليات بعد</td></tr>"}</table></div>`},
admin(){return`<h2>الإعدادات والحسابات</h2><div class="card"><b>النسخ الاحتياطي</b><div class="row" style="margin-top:6px"><button onclick="bk()">تنزيل نسخة احتياطية كاملة</button></div><p class="mut">يوجد أيضًا نسخ تلقائي أسبوعي عبر GitHub (أعدّه مرة واحدة).</p></div><div class="card"><b>الحسابات والصلاحيات</b><div class="tbl"><table>${(S.profiles||[]).map(p=>`<tr><td dir="ltr">${esc(p.name||p.id.slice(0,8))}</td><td>${p.scout_id?esc((sc(p.scout_id)||{}).name||'كشاف'):'—'}</td><td><select onchange="setRole('${p.id}',this.value)" ${SES&&p.id==SES.user.id?'disabled':''}><option value="scout" ${p.role=='scout'?'selected':''}>كشاف</option><option value="admin2" ${p.role=='admin2'?'selected':''}>المسؤول الثاني</option><option value="admin1" ${p.role=='admin1'?'selected':''}>المسؤول الأساسي</option></select></td></tr>`).join('')}</table></div></div>`}
};
const yid=u=>{const m=u.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/);return m?m[1]:null};
const media=u=>yid(u)?`<iframe src="https://www.youtube-nocookie.com/embed/${yid(u)}" allowfullscreen style="width:100%;aspect-ratio:16/9;border:0;border-radius:8px;margin-top:8px"></iframe>`:`<img src="${esc(u)}" loading="lazy" style="width:100%;border-radius:8px;margin-top:8px">`;
const li=a=>a.map(i=>`<div class="card"><b>${esc(i.t)}</b><div style="white-space:pre-wrap">${esc(i.x)}</div>${(i.m||[]).map(media).join("")}${adm()?`<button class="s" style="margin-top:8px" onclick="delL(${i.id})">حذف</button>`:""}</div>`).join("")||'<div class="mut">لا نتائج</div>';
function lq(){$("#li").innerHTML=li(S.lib[libSec].filter(i=>(i.t+i.x).includes(q)))}
async function reload(){
const g=n=>SB.from(n).select('*');
const r=await Promise.all([g('patrols'),g('scouts'),g('scout_private'),g('badges'),g('awards'),g('meetings'),g('attendance'),g('bonus'),g('library'),g('news'),g('albums'),adm()?g('audit_log'):Promise.resolve({data:[]})]);
const [pa,sc2,pv,ba,aw,me,at,bo,lb,ne,al,lg]=r.map(x=>x.data||[]);
S.patrols=pa;if(role=='admin1')S.profiles=(await SB.from('profiles').select('*')).data||[];
S.scouts=sc2.map(x=>{const v=pv.find(y=>y.scout_id==x.id)||{};return{id:x.id,photo:x.photo,claim_code:x.claim_code,name:x.name,birth:x.birth||'2012-01-01',stage:x.stage||'—',father:x.father||'—',join:x.join_date||'—',patrol:x.patrol_id,scarf:x.scarf||'—',arch:x.archived?1:0,phone:v.phone||'',parent:v.parent_phone||'',addr:v.address||''}});
S.badges=ba.map(b=>({id:b.id,name:b.name,desc:b.description||'',img:b.image||'🎖️'}));
S.awards=aw.map(w=>({b:w.badge_id,s:w.scout_id,date:w.date}));
S.meet=me.map(m=>{const p={};at.filter(a=>a.meeting_id==m.id).forEach(a=>p[a.scout_id]=a.present?1:0);return{id:m.id,date:m.date,p}});
S.bonus=bo.map(b=>({s:b.scout_id,v:b.points,why:b.reason||'',date:(b.created_at||'').slice(0,10),by:b.by_name||''}));
S.lib={'الصيحات الكشفية':[],'التقاليد الكشفية':[],'المهارات الكشفية':[],'التعليمات والقواعد':[],'المعلومات الروحية':[]};
lb.forEach(i=>{if(S.lib[i.section])S.lib[i.section].push({id:i.id,t:i.title,x:i.body||'',m:(i.media||'').split('\n').filter(Boolean)})});
S.news=ne.sort((a,b)=>b.created_at>a.created_at?1:-1).map(n=>({t:n.title,x:n.body||'',imp:n.important?1:0,date:(n.created_at||'').slice(0,10)}));
S.albums=al.map(a=>({id:a.id,photos:a.photos||[],t:a.title,date:a.event_date||'',x:a.description||''}));
S.log=lg.sort((a,b)=>b.id-a.id).map(l=>({who:l.who,op:l.op,det:l.details||'',at:new Date(l.at).toLocaleString('ar-EG')}));
}
async function C(op,det){await logit(op,det);await reload();R()}
function av(s,z){return s.photo?`<img src="${esc(s.photo)}" class="av" style="object-fit:cover;${z?`width:${z}px;height:${z}px`:""}">`:`<div class="av" style="${z?`width:${z}px;height:${z}px;font-size:26px`:""}">${ini(s.name)}</div>`}
function bi(i){return/^http/.test(i||"")?`<img src="${esc(i)}" style="width:52px;height:52px;object-fit:contain">`:`<div style="font-size:34px">${i||"🎖️"}</div>`}
function shrink(f,png){return new Promise(res=>{const i=new Image();i.onload=()=>{const k=Math.min(1,900/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);c.toBlob(b=>res(b),png?'image/png':'image/jpeg',.82)};i.src=URL.createObjectURL(f)})}
async function up(f,dir,png){const b=await shrink(f,png),path=dir+'/'+Date.now()+'-'+Math.random().toString(36).slice(2,7)+(png?'.png':'.jpg');await ok(SB.storage.from('photos').upload(path,b,{contentType:png?'image/png':'image/jpeg'}));return SB.storage.from('photos').getPublicUrl(path).data.publicUrl}
async function setPhoto(id,el){const f=el.files[0];if(!f)return;const u=await up(f,'scouts');await ok(SB.from('scouts').update({photo:u}).eq('id',id));C('تغيير صورة كشاف',sc(id).name)}
async function addPhotos(id,el){const a=S.albums.find(x=>x.id==id),fs=[...el.files];if(!fs.length)return;const us=[];for(const f of fs)us.push(await up(f,'albums'));await ok(SB.from('albums').update({photos:[...a.photos,...us]}).eq('id',id));C('إضافة صور ألبوم',a.t+' ('+us.length+')')}
function pl(l){return/^http/.test(l||"")?`<img src="${esc(l)}" style="width:44px;height:44px;object-fit:contain;border-radius:8px">`:`<span style="font-size:30px">${l||"🏴"}</span>`}
async function addP(){const n=$('#pn').value.trim();if(!n)return;await ok(SB.from('patrols').insert({name:n,color:$('#pc').value}));C('إضافة طليعة',n)}
async function saveP(id){const g=k=>$('#'+k+'_'+id),u={name:g('pn').value.trim(),color:g('pc').value,cry:g('py').value};if(g('pe').value.trim())u.logo=g('pe').value.trim();const lf=g('pl').files[0],ff=g('pf').files[0];if(lf)u.logo=await up(lf,'patrols',1);if(ff)u.flag=await up(ff,'patrols');await ok(SB.from('patrols').update(u).eq('id',id));C('تعديل طليعة',u.name)}
async function delP(id){const p=pt(id);if(!confirm('حذف طليعة '+p.name+'؟ الكشافين فيها هيفضلوا من غير طليعة'))return;await ok(SB.from('scouts').update({patrol_id:null}).eq('patrol_id',id));await ok(SB.from('patrols').delete().eq('id',id));C('حذف طليعة',p.name)}
async function delScout(id){const s=sc(id);if(!confirm('حذف '+s.name+' نهائيًا بكل سجله (حضور وبونص وشارات)؟ لا يمكن التراجع'))return;await ok(SB.from('bonus').delete().eq('scout_id',id));await ok(SB.from('scouts').delete().eq('id',id));location.hash='scouts';C('حذف كشاف',s.name)}
async function newScouts(names){const r=await ok(SB.from('scouts').insert(names.map(n=>({name:n,patrol_id:S.patrols[0]?S.patrols[0].id:null}))).select());await ok(SB.from('scout_private').insert(r.data.map(x=>({scout_id:x.id}))))}
async function saveScout(id){const v=k=>$('#e_'+k).value;await ok(SB.from('scouts').update({name:v('name'),birth:v('birth')||null,stage:v('stage'),father:v('father'),join_date:v('join')||null,scarf:v('scarf')}).eq('id',id));await ok(SB.from('scout_private').upsert({scout_id:id,phone:v('phone'),parent_phone:v('parent'),address:v('addr')}));C('تعديل بيانات كشاف',v('name'))}
async function addScout(){const n=$('#nn').value.trim();if(!n)return;await newScouts([n]);C('إضافة كشاف',n)}
function imp(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=async()=>{const rows=r.result.split(/\r?\n/).map(x=>x.split(',')[0].trim()).filter(Boolean);await newScouts(rows);C('استيراد كشافين',rows.length+' اسم')};r.readAsText(f)}
async function mv(id,p){await ok(SB.from('scouts').update({patrol_id:+p}).eq('id',id));C('نقل كشاف',sc(id).name)}
async function arch(id){const s=sc(id);await ok(SB.from('scouts').update({archived:!s.arch}).eq('id',id));C(s.arch?'استرجاع':'أرشفة',s.name)}
async function editP(id){const p=pt(id),v=prompt('الصيحة الجديدة',p.cry);if(v){await ok(SB.from('patrols').update({cry:v}).eq('id',id));C('تعديل طليعة',p.name)}}
async function newM(){const d=$('#md').value;if(!d||S.meet.some(m=>m.date==d))return;const r=await ok(SB.from('meetings').insert({date:d}).select());await ok(SB.from('attendance').insert(act().map(s=>({meeting_id:r.data[0].id,scout_id:s.id,present:false}))));C('تسجيل اجتماع',d)}
async function tg(d,id){const m=S.meet.find(x=>x.date==d);await ok(SB.from('attendance').upsert({meeting_id:m.id,scout_id:id,present:!m.p[id]}));C('تعديل حضور',d+' - '+sc(id).name)}
async function addB(){const v=+$('#bv').value,w=$('#bw').value.trim(),t=$('#bt').value;if(!v||!w)return;const ids=t=='s'?[+$('#bs').value]:t=='p'?act().filter(s=>s.patrol==$('#bp').value).map(s=>s.id):act().map(s=>s.id);await ok(SB.from('bonus').insert(ids.map(s=>({scout_id:s,points:v,reason:w,by_name:ROLE[role]}))));C('بونص '+(v>0?'إضافة':'خصم'),w+' ('+ids.length+' كشاف)')}
async function award(){await ok(SB.from('awards').insert({badge_id:+$('#gb').value,scout_id:+$('#gs').value}));C('منح شارة',sc($('#gs').value).name)}
async function addBadge(){const n=$('#bn').value.trim();if(!n)return;const f=$('#bf').files[0];const img=f?await up(f,'badges',1):'🎖️';await ok(SB.from('badges').insert({name:n,description:$('#bd').value,image:img}));C('إضافة شارة',n)}
async function addL(){const t=$('#lt').value.trim();if(!t)return;const m=[];for(const f of $('#lf').files)m.push(await up(f,'library'));const y=$('#ly').value.trim();if(y)m.push(y);await ok(SB.from('library').insert({section:libSec,title:t,body:$('#lx').value,media:m.join('\n')}));C('إضافة محتوى',t)}
async function delL(id){if(!confirm('حذف هذا المحتوى؟'))return;await ok(SB.from('library').delete().eq('id',id));C('حذف محتوى',String(id))}
async function addN(){const t=$('#nt').value.trim();if(!t)return;await ok(SB.from('news').insert({title:t,body:$('#nx').value,important:$('#ni').checked}));C('نشر خبر',t)}
async function addA(){const t=$('#at').value.trim();if(!t)return;await ok(SB.from('albums').insert({title:t,event_date:today}));C('ألبوم جديد',t)}
async function bk(){const out={};for(const t of ['patrols','scouts','scout_private','meetings','attendance','bonus','badges','awards','library','news','albums','audit_log'])out[t]=(await SB.from(t).select('*')).data;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(out)],{type:'application/json'}));a.download='elfanar-backup-'+today+'.json';a.click();logit('نسخة احتياطية','يدوي')}
async function setRole(id,r){await ok(SB.from('profiles').update({role:r}).eq('id',id));C('تغيير صلاحية','→ '+r)}
function rs(){alert('الاسترجاع يتم من لوحة Supabase')}
async function linkCode(){const r=await SB.rpc('claim_scout',{c:$('#cc').value});if(r.error||!r.data){alert('الكود غير صحيح أو مستخدم من قبل');return}boot()}
async function doSignup(){const m=$('#lm'),c=$('#sc').value.trim();if(!c){m.textContent='اكتب كود الربط';return}
const r=await SB.auth.signUp({email:$('#em').value.trim(),password:$('#pw').value});if(r.error){m.textContent=r.error.message;return}
if(!r.data.session){m.textContent='تحقق من بريدك لتفعيل الحساب ثم ادخل';return}
const k=await SB.rpc('claim_scout',{c});if(k.error||!k.data)alert('تم إنشاء الحساب، لكن الكود غير صحيح. اربطه من صفحتك.');boot()}
async function doLogin(){const r=await SB.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});if(r.error){$('#lm').textContent='البريد أو كلمة المرور غير صحيحة';return}boot()}
let SES=null;
async function lbc(){if(!SES){$('#login').style.display='grid';return}try{await SB.auth.signOut({scope:'local'})}catch(e){}try{Object.keys(localStorage).filter(k=>k.indexOf('sb-')==0).forEach(k=>localStorage.removeItem(k))}catch(e){}location.href=location.pathname}
async function boot(){const {data}=await SB.auth.getSession();SES=data.session;role='scout';
if(SES){const p=await SB.from('profiles').select('role').eq('id',SES.user.id).single();role=(p.data&&p.data.role)||'scout'}
if(SES&&role=='scout'&&!location.hash)location.hash='me';$('#login').style.display='none';$('#who').textContent=SES?ROLE[role]:'';$('#lb').textContent=SES?'خروج':'دخول الإدارة';await reload();R()}
addEventListener('hashchange',R);boot();
</script>
</body>
</html>
